<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Система обработки заказов</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 22px; }
  label { display: block; margin-top: 12px; font-weight: 600; }
  input { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 4px; }
  button { margin-top: 18px; padding: 10px 18px; cursor: pointer; }
  #result { margin-top: 20px; padding: 12px; border-radius: 6px; display: none; white-space: pre-wrap; }
  .ok   { background: #e6ffed; color: #0a6b2d; border: 1px solid #0a6b2d; }
  .err  { background: #ffecec; color: #a30000; border: 1px solid #a30000; }
</style>
</head>
<body>

<h1>Оформление заказа</h1>

<form id="orderForm">
  <label for="customer">Покупатель</label>
  <input type="text" id="customer" name="customer" required>

  <label for="product">Товар</label>
  <input type="text" id="product" name="product" required>

  <label for="amount">Сумма</label>
  <input type="number" id="amount" name="amount" step="0.01" min="0.01" required>

  <button type="submit">Отправить заказ</button>
</form>

<div id="result"></div>

<script>
  const form   = document.getElementById('orderForm');
  const result = document.getElementById('result');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const payload = {
      customer: document.getElementById('customer').value.trim(),
      product:  document.getElementById('product').value.trim(),
      amount:   parseFloat(document.getElementById('amount').value)
    };

    result.style.display = 'none';
    result.className = '';

    try {
      const resp = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await resp.json();

      if (resp.ok) {
        result.className = 'ok';
        result.textContent = `Заказ создан. order_id = ${data.order_id}`;
        form.reset();
      } else {
        result.className = 'err';
        result.textContent = `Ошибка: ${data.error || resp.statusText}`;
      }
    } catch (err) {
      result.className = 'err';
      result.textContent = `Сетевая ошибка: ${err.message}`;
    }

    result.style.display = 'block';
  });
</script>

</body>
</html>
